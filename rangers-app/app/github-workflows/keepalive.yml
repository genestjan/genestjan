# Copy to .github/workflows/. Stops the free Supabase project pausing after a week of silence.
# Note: GitHub switches scheduled workflows off after 60 days without repository activity; any commit turns them back on.
name: Keep Supabase awake
on: { schedule: [{ cron: '17 3 * * 1,4' }], workflow_dispatch: {} }
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ vars.VITE_SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
