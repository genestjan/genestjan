<!doctype html>
<html lang="tl"><head><meta charset="utf-8"><title>stage</title>
<style>
@font-face { font-family: Barlow; font-weight: 600; src: url(/app/assets/__BARLOW600__) format('woff2'); }
@font-face { font-family: Barlow; font-weight: 700; src: url(/app/assets/__BARLOW700__) format('woff2'); }
@font-face { font-family: Bebas; src: url(/app/assets/__BEBAS__) format('woff2'); }
html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; background: #061633; color: #fff; font-family: Barlow, sans-serif; }
#bg { position: absolute; inset: 0; background: radial-gradient(120% 60% at 50% 38%, #164a92 0%, #0b2c6b 45%, #061633 100%); }
#bg::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(246,196,49,.035) 0 18px, transparent 18px 36px); }
#top { position: absolute; left: 20px; right: 20px; top: 16px; height: 46px; display: flex; align-items: center; gap: 10px; }
#top img { height: 44px; width: 44px; object-fit: contain; }
#brand { font-family: Bebas, sans-serif; font-size: 32px; letter-spacing: 1px; line-height: 1; }
#brand small { display: block; font-family: Barlow, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .5px; color: #cfd9ee; }
#chip { margin-left: auto; background: #f6c431; color: #0a1f44; font-weight: 700; font-size: 15px; padding: 7px 14px; border-radius: 999px; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .3s; }
#chip:empty { opacity: 0; }
#phone { position: absolute; left: 82px; top: 74px; width: 376px; height: 756px; border-radius: 46px; background: #05070d; box-shadow: 0 0 0 2px #31477a, 0 26px 60px rgba(0,0,0,.55); }
#phone iframe { position: absolute; left: 8px; top: 8px; width: 360px; height: 740px; border: 0; border-radius: 38px; background: #061633; }
#cap { position: absolute; left: 22px; right: 22px; top: 838px; height: 112px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; font-size: 23px; line-height: 1.24; transition: opacity .22s; text-wrap: balance; }
#cap.off { opacity: 0; }
#cap b { color: #f6c431; }
#ptr { position: absolute; left: 270px; top: 600px; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgba(255,255,255,.5); border: 3px solid #f6c431; box-shadow: 0 2px 10px rgba(0,0,0,.45); opacity: 0; pointer-events: none; z-index: 10; transition: left .55s cubic-bezier(.45,0,.2,1), top .55s cubic-bezier(.45,0,.2,1), opacity .3s, transform .12s; }
#ptr.on { opacity: 1; }
#ptr.down { transform: scale(.75); background: rgba(246,196,49,.75); }
.rip { position: absolute; width: 22px; height: 22px; margin: -14px 0 0 -14px; border-radius: 50%; border: 3px solid #f6c431; animation: rip .65s ease-out forwards; pointer-events: none; z-index: 9; }
@keyframes rip { to { transform: scale(4.2); opacity: 0; } }
#card { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 40px; background: radial-gradient(110% 70% at 50% 40%, #164a92 0%, #0a2a66 45%, #061633 100%); opacity: 0; transition: opacity .45s; pointer-events: none; }
#card.on { opacity: 1; }
#card img { width: 150px; height: 150px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(0,0,0,.4)); }
#card .k { font-family: Bebas, sans-serif; font-size: 34px; letter-spacing: 2px; color: #f6c431; }
#card h1 { margin: 0; font-size: 46px; line-height: 1.05; font-weight: 700; text-wrap: balance; }
#card p { margin: 0; font-size: 24px; line-height: 1.3; color: #dbe4f5; font-weight: 600; text-wrap: balance; }
#card p b { color: #f6c431; }
#card .pill { margin-top: 6px; background: #f6c431; color: #0a1f44; font-weight: 700; font-size: 26px; padding: 12px 26px; border-radius: 999px; }
#card.pop h1, #card.pop p, #card.pop .pill, #card.pop img, #card.pop .k { animation: up .6s cubic-bezier(.2,.8,.2,1) both; }
#card.pop p { animation-delay: .12s; } #card.pop .pill { animation-delay: .24s; } #card.pop img { animation-delay: 0s; }
#card ul.feat { list-style: none; margin: 4px 0 0; padding: 0; width: 100%; display: grid; gap: 8px; text-align: left; }
#card ul.feat li { display: flex; gap: 12px; align-items: center; font-size: 20px; font-weight: 600; line-height: 1.22; color: #eef3fb; background: rgba(255,255,255,.07); border-radius: 12px; padding: 8px 12px; }
#card ul.feat li::before { content: '\2713'; font-family: 'DejaVu Sans', sans-serif; flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: #f6c431; color: #0a1f44; font-size: 14px; font-weight: 700; }
#card ul.feat li b { color: #f6c431; }
#card.pop ul.feat li { animation: up .5s cubic-bezier(.2,.8,.2,1) both; }
#card.list { gap: 12px; padding: 0 30px; }
#card.list h1 { font-size: 36px; }
@keyframes up { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }
</style></head>
<body>
<div id="bg"></div>
<div id="top"><img src="/app/crest.png" alt=""><div id="brand">RANGERS APP<small>RANGERS FC · FC NEW MABU · GILA ACADEMY</small></div><div id="chip"></div></div>
<div id="phone"><iframe id="app" name="app" src="about:blank"></iframe></div>
<div id="cap" class="off"></div>
<div id="ptr"></div>
<div id="card"></div>
<script>
let hideT;
window.S = {
  cap(html) { const c = document.getElementById('cap'); c.classList.add('off'); setTimeout(() => { c.innerHTML = html ? "<span>" + html + "</span>" : ""; if (html) c.classList.remove('off'); }, html === null ? 0 : 230); },
  chip(t) { document.getElementById('chip').textContent = t || ''; },
  ptr(x, y, instant) { const p = document.getElementById('ptr'); p.style.transition = instant ? 'opacity .3s, transform .12s' : ''; p.classList.add('on'); p.style.left = x + 'px'; p.style.top = y + 'px'; clearTimeout(hideT); hideT = setTimeout(() => p.classList.remove('on'), 2200); },
  press(x, y) { const p = document.getElementById('ptr'); p.classList.add('down'); const r = document.createElement('div'); r.className = 'rip'; r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 800); setTimeout(() => p.classList.remove('down'), 180); },
  load(u) { const old = document.getElementById('app'); const f = document.createElement('iframe'); f.id = 'app'; f.name = 'app'; f.src = u; old.replaceWith(f); },
  hidePtr() { document.getElementById('ptr').classList.remove('on'); },
  card(html, cls) { const c = document.getElementById('card'); if (html) { c.classList.remove('pop', 'list'); if (cls) c.classList.add(cls); c.innerHTML = html; void c.offsetWidth; c.classList.add('on', 'pop'); } else c.classList.remove('on'); },
};
</script>
</body></html>
