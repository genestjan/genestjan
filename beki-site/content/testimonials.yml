quotes:
- photo: assets/img/t-sarita.webp
  name: Sarita
  quote: In terms of the investment I made in your course, I've made like 10 times that back. So that's been a very, very worthwhile financial investment and it continues to pay off.
- photo: assets/img/t-angela.webp
  name: Angela
  quote: The most obvious one now is that I'm making sales. My parent coaching program is selling and that feels great. May has been my greatest income month yet.
- photo: assets/img/t-alex.webp
  name: Alex
  quote: I like making money monthly with my business, it's thriving. People are coming to me asking for services, not what I expected to happen in just six short months.
