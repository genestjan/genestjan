name: Build Monggols VPN for Android

on:
  push:
    branches: [claude/plugin-installation-5r36f2, main]
    paths: ["vpn/android/**", ".github/workflows/monggols-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monggols-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpn/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      # Signs with the key in the MONGGOLS_KEYSTORE_BASE64 and
      # MONGGOLS_KEYSTORE_PASSWORD repository secrets. The same key must be used
      # every time, or phones refuse to install the update over the old app.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MONGGOLS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the MONGGOLS_KEYSTORE_BASE64 and MONGGOLS_KEYSTORE_PASSWORD secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/monggols.jks"

      - name: Build
        env:
          MONGGOLS_KEYSTORE: ${{ runner.temp }}/monggols.jks
          MONGGOLS_KEYSTORE_PASSWORD: ${{ secrets.MONGGOLS_KEYSTORE_PASSWORD }}
          MONGGOLS_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MonggolsVPN.apk

      # Always the same download address:
      # https://github.com/genestjan/genestjan/releases/download/monggols-android/MonggolsVPN.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: monggols-android
          name: Monggols VPN for Android
          body: Latest Android build of Monggols VPN (build ${{ github.run_number }}).
          files: vpn/android/MonggolsVPN.apk
          make_latest: false
