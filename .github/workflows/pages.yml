name: Build and deploy to GitHub Pages

on:
  push:
    branches: [claude/plugin-installation-5r36f2, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ridewise/package-lock.json
            fetch/package-lock.json
            gen-pedal-hub/package-lock.json
            bikemoko/package-lock.json
      - run: npm ci
      - run: npm run build
      # next.config.mjs sets output:'export', so the static site lands in out/
      # RideWise (cycling pit stop planner) is its own Vite app, served at /ridewise/
      - run: npm ci
        working-directory: ridewise
      - run: npm test
        working-directory: ridewise
      - run: npm run build
        working-directory: ridewise
      - run: cp -r ridewise/dist out/ridewise
      # Fetch GenSan (ride, pabili, delivery): customer app at /fetch/, driver app at /fetch/driver/
      - run: npm ci
        working-directory: fetch
      - run: npm test
        working-directory: fetch
      - run: npm run build
        working-directory: fetch
        env:
          VITE_SUPABASE_URL: ${{ vars.FETCH_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.FETCH_SUPABASE_ANON_KEY }}
          VITE_TTS_URL: ${{ vars.FETCH_TTS_URL }}
      - run: cp -r fetch/dist out/fetch
      # Gen Pedal Hub (cycling app): web version at /pedalhub/, installable on iPhone from Safari
      - run: npm ci
        working-directory: gen-pedal-hub
      - run: npm test
        working-directory: gen-pedal-hub
      - run: npm run build:web
        working-directory: gen-pedal-hub
      - run: cp -r gen-pedal-hub/dist out/pedalhub
      # The Android APK is built by pedalhub-apk.yml; copy the newest one next to the web app
      - name: Add the Android APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download pedalhub-latest --pattern gen-pedal-hub.apk --dir out/pedalhub
      # Bikemoko (inventory, POS and repairs) is its own Vite app, served at /bikemoko/.
      # Every Bikemoko step is continue-on-error, so a Bikemoko problem can never stop the main website.
      - name: Bikemoko install
        continue-on-error: true
        run: npm ci
        working-directory: bikemoko
      - name: Bikemoko tests
        id: bikemoko_tests
        continue-on-error: true
        run: npm test
        working-directory: bikemoko
      # Only publish Bikemoko when its tests passed.
      - name: Bikemoko build
        if: steps.bikemoko_tests.outcome == 'success'
        continue-on-error: true
        run: npm run build
        working-directory: bikemoko
        env:
          VITE_SUPABASE_URL: ${{ vars.BIKEMOKO_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.BIKEMOKO_SUPABASE_ANON_KEY }}
      - name: Add Bikemoko to the site
        continue-on-error: true
        run: |
          if [ -d bikemoko/dist ]; then cp -r bikemoko/dist out/bikemoko; else echo "No Bikemoko build, skipping"; fi
      # The Android APK is built by bikemoko-android.yml; copy the newest one next to the web app
      - name: Add the Bikemoko Android APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download bikemoko-android --pattern '*.apk' --dir out/bikemoko
      # Monggols VPN home-screen app for iPhone: the shared screen from vpn/ui, served at /monggols/
      - run: cp -r vpn/ui out/monggols
      # Beki's draft website: built from beki-site/ (its words and pictures are edited at /BekiEakinsdraftwebsite/admin/)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0 pyyaml==6.0.2
      - run: python beki-site/build.py
        env:
          BEKI_OUT: out/BekiEakinsdraftwebsite
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000 # 30 minutes: GitHub Pages sometimes takes longer than the 10-minute default to copy the files
