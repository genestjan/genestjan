name: Build and deploy to GitHub Pages

on:
  push:
    branches: [claude/plugin-installation-5r36f2, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ridewise/package-lock.json
      - run: npm ci
      - run: npm run build
      # next.config.mjs sets output:'export', so the static site lands in out/
      # RideWise (cycling pit stop planner) is its own Vite app, served at /ridewise/
      - run: npm ci
        working-directory: ridewise
      - run: npm test
        working-directory: ridewise
      - run: npm run build
        working-directory: ridewise
      - run: cp -r ridewise/dist out/ridewise
      # Monggols VPN home-screen app for iPhone: the shared screen from vpn/ui, served at /monggols/
      - run: cp -r vpn/ui out/monggols
      # Beki's draft website: built from beki-site/ (its words and pictures are edited at /BekiEakinsdraftwebsite/admin/)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0 pyyaml==6.0.2
      - run: python beki-site/build.py
        env:
          BEKI_OUT: out/BekiEakinsdraftwebsite
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
