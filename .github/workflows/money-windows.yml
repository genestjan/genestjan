name: Build Money Hub for Windows

on:
  push:
    branches: [claude/dreamy-clarke-iht8hw, main]
    paths: ["money/web/**", "money/windows/**", ".github/workflows/money-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: money-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: money/web/package-lock.json

      - name: Build the shared screen
        working-directory: money/web
        # Your cloud's address and publishable key (public by design: Row Level Security and
        # end-to-end encryption protect the data), so the apps never ask for them.
        env:
          MONEY_VERSION: 1.0.${{ github.run_number }}
          VITE_SUPABASE_URL: ${{ secrets.MONEY_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.MONEY_SUPABASE_KEY }}
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app
        working-directory: money/windows
        run: dotnet publish -c Release -o publish -p:Version=1.0.${{ github.run_number }}

      - name: Build installer
        working-directory: money/windows
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyHub-windows
          path: money/windows/output/Money-Hub-Setup.exe

      # Always the same download address:
      # https://github.com/genestjan/genestjan/releases/download/money-windows/Money-Hub-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: money-windows
          name: Money Hub for Windows
          body: Latest Windows build of Money Hub (build ${{ github.run_number }}). Run the installer, then follow money/SETUP.md.
          files: money/windows/output/Money-Hub-Setup.exe
          make_latest: false
