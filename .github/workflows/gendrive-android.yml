name: Build GenDrive for Android

on:
  push:
    branches: [claude/hopeful-mayer-0qfopm, main]
    paths: ["gendrive/**", ".github/workflows/gendrive-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gendrive-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gendrive/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      # Plain-Kotlin logic first: lyrics, trips, costs, drive rules, voice.
      - name: Test core logic
        run: ./gradlew --no-daemon -p ../core test

      # Signs with GENDRIVE_KEYSTORE_BASE64 / GENDRIVE_KEYSTORE_PASSWORD if set,
      # otherwise with the existing Monggols key, so every build installs over
      # the last one. The same key must be used every time.
      - name: Build APK
        env:
          GENDRIVE_VERSION_CODE: ${{ github.run_number }}
          GD_KS: ${{ secrets.GENDRIVE_KEYSTORE_BASE64 }}
          GD_PW: ${{ secrets.GENDRIVE_KEYSTORE_PASSWORD }}
          MG_KS: ${{ secrets.MONGGOLS_KEYSTORE_BASE64 }}
          MG_PW: ${{ secrets.MONGGOLS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$GD_KS" ]; then
            echo "$GD_KS" | base64 -d > "$RUNNER_TEMP/gendrive.jks"
            export GENDRIVE_KEYSTORE="$RUNNER_TEMP/gendrive.jks" GENDRIVE_KEYSTORE_PASSWORD="$GD_PW" GENDRIVE_KEY_ALIAS=gendrive
          elif [ -n "$MG_KS" ]; then
            echo "$MG_KS" | base64 -d > "$RUNNER_TEMP/gendrive.jks"
            export GENDRIVE_KEYSTORE="$RUNNER_TEMP/gendrive.jks" GENDRIVE_KEYSTORE_PASSWORD="$MG_PW" GENDRIVE_KEY_ALIAS=monggols
          else
            echo "::warning::No signing key secret found. This APK uses a throwaway key; updating will need an uninstall first."
          fi
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GenDrive.apk
          rm -f "$RUNNER_TEMP/gendrive.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: GenDrive-apk
          path: gendrive/android/GenDrive.apk

      # Always the same download address:
      # https://github.com/genestjan/genestjan/releases/download/gendrive-android/GenDrive.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: gendrive-android
          name: GenDrive for Android
          body: Latest GenDrive build for BYD head units (build ${{ github.run_number }}). Install guide in gendrive/docs/INSTALL.md.
          files: gendrive/android/GenDrive.apk
          prerelease: true
          make_latest: false
