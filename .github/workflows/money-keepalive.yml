name: Keep the Money Hub cloud awake

# Supabase pauses free projects after a week with no use. One small call a day keeps it awake
# while you are on holiday. Needs the MONEY_SUPABASE_URL and MONEY_SUPABASE_KEY secrets
# (money/SETUP.md, part 6). Scheduled runs only happen once this file is on the main branch.

on:
  schedule:
    - cron: "17 21 * * *" # 5:17 am in the Philippines
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          URL: ${{ secrets.MONEY_SUPABASE_URL }}
          KEY: ${{ secrets.MONEY_SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::Add the MONEY_SUPABASE_URL and MONEY_SUPABASE_KEY secrets to keep the cloud awake."
            exit 0
          fi
          # Just the project's host, whatever was pasted (a /rest/v1/ ending, spaces, quotes), as the apps do.
          HOST=$(printf '%s' "$URL" | tr -d '[:space:]"' | sed -E 's|^[A-Za-z]+://||; s|[/?#].*$||')
          KEY=$(printf '%s' "$KEY" | tr -d '[:space:]"')
          curl -fsS -X POST "https://$HOST/rest/v1/rpc/money_ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
