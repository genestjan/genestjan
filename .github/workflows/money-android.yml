name: Build Money Hub for Android

on:
  push:
    branches: [claude/dreamy-clarke-iht8hw, main]
    paths: ["money/web/**", "money/android/**", ".github/workflows/money-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: money-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: money/web/package-lock.json

      - name: Test and build the shared screen
        working-directory: money/web
        env:
          MONEY_VERSION: 1.0.${{ github.run_number }}
        run: |
          npm ci
          npm test
          npm run build

      # GitHub's Ubuntu runners come with the Android SDK (ANDROID_HOME); Gradle fetches any
      # missing platform itself. (android-actions/setup-android@v3 now fails asking for the
      # retired "tools" package.)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Signs with Money Hub's key from the MONEY_KEYSTORE_BASE64 and MONEY_KEYSTORE_PASSWORD
      # repository secrets (money/SETUP.md, part 1). The same key must be used every time, or the
      # phone refuses to install an update over the old app.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MONEY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key secret found, so this APK uses a throwaway key. Updates will need an uninstall first."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/money.jks"
            echo "MONEY_KEYSTORE=$RUNNER_TEMP/money.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: money/android
        env:
          MONEY_KEYSTORE_PASSWORD: ${{ secrets.MONEY_KEYSTORE_PASSWORD }}
          MONEY_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MoneyHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyHub-android
          path: money/android/MoneyHub.apk

      # Always the same download address:
      # https://github.com/genestjan/genestjan/releases/download/money-android/MoneyHub.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: money-android
          name: Money Hub for Android
          body: Latest Android build of Money Hub (build ${{ github.run_number }}). Install on the phone, then follow money/SETUP.md.
          files: money/android/MoneyHub.apk
          make_latest: false
